name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Static build validation
        run: ./scripts/check.sh
      - name: Install Node test dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Install Xvfb authorization helper
        run: sudo apt-get install -y xauth
      - name: Browser verification
        run: ./scripts/test-ui.sh
      - name: LiveReload regression verification
        run: ./scripts/test-live-reload.sh
      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
